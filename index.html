<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time</title>
<style>
  /* Always-dark display by design: a clock meant for a screen in a dark room. */
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8a8f;
    --alert: #ff2a2a;
    --warm: #ffd9a8;
    --hue: 210;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body.idle { cursor: none; }

  /* Layers: flash (0) < stage (1) < banner text (in stage) < confetti (3) < controls (6) < dark (10) */
  #flashLayer {
    position: fixed; inset: 0;
    background: var(--alert);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  body.flashing #flashLayer { animation: flash 0.7s ease-in-out infinite; }
  @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 0.9; } }

  #stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  #banner {
    min-height: 1.5em;
    font-size: clamp(16px, 3vw, 40px);
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--warm);
    opacity: 0;
    transition: opacity 0.6s ease;
    margin-bottom: 0.4em;
  }
  #banner.on { opacity: 1; }

  #clock {
    position: relative;
    font-weight: 200;
    font-size: min(18vw, 34vh);
    line-height: 1;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 0.4em hsla(var(--hue), 90%, 60%, 0.28);
    transition: color 1.5s ease, text-shadow 1.5s ease;
    cursor: pointer;
  }
  #ampm {
    position: absolute;
    left: 100%;
    bottom: 0.12em;
    margin-left: 0.12em;
    font-size: 0.2em;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-shadow: none;
  }
  #clock.pop { animation: pop 1.2s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { 0% { transform: scale(1); } 20% { transform: scale(1.07); } 100% { transform: scale(1); } }

  body.warn #clock {
    color: var(--warm);
    text-shadow: 0 0 0.45em rgba(255, 80, 40, 0.65);
  }

  #date {
    margin-top: 0.9em;
    font-size: clamp(14px, 2.4vw, 32px);
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  #hourNote {
    margin-top: 0.7em;
    min-height: 1.4em;
    font-size: clamp(16px, 3vw, 40px);
    font-weight: 200;
    color: var(--fg);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #hourNote.on { opacity: 1; transform: none; }

  #progress {
    position: fixed;
    left: 0; bottom: 0;
    height: 3px;
    width: 0;
    background: linear-gradient(90deg, hsla(var(--hue), 90%, 60%, 0.15), hsla(var(--hue), 90%, 65%, 0.9));
    z-index: 2;
    transition: width 1s linear;
  }
  body.warn #progress { background: linear-gradient(90deg, rgba(255,80,40,.2), rgba(255,120,60,.95)); }

  #confetti {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  #fsBtn {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 24px;
    z-index: 6;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  #fsBtn:focus-visible { outline: 2px solid hsl(var(--hue), 90%, 65%); outline-offset: 3px; }

  #fsBtn { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  body.active #fsBtn { opacity: 1; }
  body.active #fsBtn { pointer-events: auto; }
  #fsBtn.gone { display: none; }

  #dark {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  @media (prefers-reduced-motion: reduce) {
    body.flashing #flashLayer { animation-duration: 2.6s; }
    #clock.pop { animation: none; }
  }
</style>
</head>
<body>

<div id="flashLayer"></div>

<div id="stage">
  <div id="banner"></div>
  <div id="clock" title="Click to switch between 12 and 24 hour"><span id="time"></span><span id="ampm"></span></div>
  <div id="date"></div>
  <div id="hourNote"></div>
</div>

<div id="progress"></div>
<canvas id="confetti"></canvas>

<button id="fsBtn">Fullscreen</button>
<div id="dark"></div>

<script>
(function () {
  'use strict';

  /* ---------- Settings ---------- */
  var WAKE_HOUR = 6;        // stays black from midnight until this hour (0 to 23). Click or tap to peek.
  var PEEK_MS = 8000;       // how long a peek stays visible while it's dark

  /* ---------- Helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };

  var timeEl = $('time'), ampmEl = $('ampm'), dateEl = $('date'), clockEl = $('clock');
  var bannerEl = $('banner'), noteEl = $('hourNote'), progressEl = $('progress');
  var darkEl = $('dark'), btn = $('fsBtn');

  var use24 = false;
  try { use24 = localStorage.getItem('clock24') === '1'; } catch (e) {}

  /* ---------- Confetti ---------- */
  var cv = $('confetti'), ctx = cv.getContext('2d');
  var W = 0, H = 0, parts = [], raf = null, rainUntil = 0;
  var COLORS = ['#ff3b6b', '#ffb800', '#2ee6a6', '#3aa0ff', '#b86bff', '#ffffff', '#ff7a3a'];

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function addPiece(x, y, vx, vy) {
    var shape = Math.random();
    var s = Math.max(0.7, Math.min(H, 1000) / 900);
    parts.push({
      x: x, y: y, vx: vx, vy: vy,
      w: rand(7, 13) * s, h: rand(4, 8) * s,
      rot: rand(0, 6.28), vr: rand(-0.25, 0.25),
      tilt: rand(0, 6.28), vt: rand(0.08, 0.28),
      color: COLORS[(Math.random() * COLORS.length) | 0],
      round: shape < 0.2,
      age: 0, life: rand(260, 420)
    });
  }

  // A cannon: fire a fan of pieces from (x, y) at angleDeg (90 = straight up)
  function cannon(x, y, angleDeg, count) {
    var scale = Math.max(0.7, H / 900);
    for (var i = 0; i < count; i++) {
      var a = (angleDeg + rand(-24, 24)) * Math.PI / 180;
      var sp = rand(13, 30) * scale;
      addPiece(x, y, Math.cos(a) * sp, -Math.sin(a) * sp);
    }
    start();
  }

  function rain(ms) {
    rainUntil = Math.max(rainUntil, performance.now() + ms);
    start();
  }

  function celebrate() {
    var t = [0, 350, 800];
    t.forEach(function (d) {
      setTimeout(function () {
        cannon(0, H, 62, 70);
        cannon(W, H, 118, 70);
      }, d);
    });
    setTimeout(function () { cannon(W / 2, H, 90, 90); }, 500);
    rain(4200);
  }

  function start() { if (!raf) raf = requestAnimationFrame(step); }

  function step(now) {
    ctx.clearRect(0, 0, W, H);

    if (now < rainUntil) {
      for (var k = 0; k < 3; k++) addPiece(rand(0, W), -20, rand(-1.5, 1.5), rand(1, 4));
    }

    var g = 0.32 * Math.max(0.7, H / 900);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += g;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr; p.tilt += p.vt;
      p.age++;

      if (p.y > H + 40 || p.age > p.life) { parts.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = Math.min(1, (p.life - p.age) / 40);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.tilt));   // flutter
      ctx.fillStyle = p.color;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h * 0.7, 0, 6.283); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }

    if (parts.length || now < rainUntil) raf = requestAnimationFrame(step);
    else { raf = null; ctx.clearRect(0, 0, W, H); }
  }

  /* ---------- Clock ---------- */
  var lastSecond = -1, lastMinute = -1;

  function render(now) {
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    var hh = use24 ? pad(h) : String((h % 12) || 12);
    timeEl.textContent = hh + ':' + pad(m) + ':' + pad(s);
    ampmEl.textContent = use24 ? '' : (h < 12 ? 'AM' : 'PM');
    progressEl.style.width = (((m * 60 + s) / 3600) * 100).toFixed(2) + '%';

    if (m !== lastMinute) {
      lastMinute = m;
      dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      // The glow follows the time of day around the colour wheel
      document.documentElement.style.setProperty('--hue', Math.round(h * 15 + m / 4));
    }
  }

  /* ---------- Hour notes ---------- */
  var noteTimer = null;
  function showNote(text, ms) {
    noteEl.textContent = text;
    noteEl.classList.add('on');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { noteEl.classList.remove('on'); }, ms);
  }
  function hourWord(h) {
    if (h === 12) return 'Noon';
    var n = (h % 12) || 12;
    return n + " o'clock";
  }
  function popClock() {
    clockEl.classList.remove('pop');
    void clockEl.offsetWidth;
    clockEl.classList.add('pop');
  }

  /* ---------- Events ---------- */
  var firedHour = '', firedHalf = '';
  var demoFlashUntil = 0, demoDarkUntil = 0, peekUntil = 0;
  var darkState = null;

  function setDark(on, instant) {
    darkEl.style.transition = instant ? 'none' : (on ? 'opacity 4s ease' : 'opacity 1s ease');
    darkEl.style.opacity = on ? '1' : '0';
    darkState = on;
  }

  function tick() {
    var now = new Date();
    var t = Date.now();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

    if (s !== lastSecond) { lastSecond = s; render(now); }

    var key = now.toDateString() + '-' + h;

    // Top of every hour (midnight has its own moment, below)
    if (m === 0 && s < 3 && h !== 0 && firedHour !== key) {
      firedHour = key;
      celebrate();
      popClock();
      showNote(hourWord(h), 7000);
    }
    // Half past: a quiet nod, no confetti
    if (m === 30 && s < 3 && firedHalf !== key) {
      firedHalf = key;
      showNote('Half past ' + ((h % 12) || 12), 4000);
    }

    // Last five minutes before midnight
    var countdown = h === 23 && m >= 55;
    var flashing =
      (h === 23 && m === 55 && s < 10) ||               // big alert at 11:55
      (h === 23 && m >= 56 && m <= 58 && s < 3) ||      // short reminder each minute
      (h === 23 && m === 59 && (s < 3 || s >= 50)) ||   // and the final ten seconds
      t < demoFlashUntil;
    var warn = countdown || t < demoFlashUntil;

    document.body.classList.toggle('flashing', flashing);
    document.body.classList.toggle('warn', warn);

    // Banner text
    var bannerText = '';
    if (countdown) {
      var left = (59 - m) * 60 + (60 - s); // seconds to midnight
      if (m === 55 && s < 10) bannerText = '5 minutes to midnight';
      else bannerText = 'Midnight in ' + Math.floor(left / 60) + ':' + pad(left % 60);
    } else if (t < demoFlashUntil) {
      bannerText = '5 minutes to midnight';
    } else if (h === 0 && m === 0 && s < 6) {
      bannerText = 'Goodnight';
    }
    if (bannerText) { bannerEl.textContent = bannerText; bannerEl.classList.add('on'); }
    else bannerEl.classList.remove('on');

    // Midnight dim: black from midnight until WAKE_HOUR
    var scheduledDark = h < WAKE_HOUR;
    var wantDark = (t < demoDarkUntil) || (scheduledDark && t >= peekUntil);
    if (wantDark !== darkState) {
      var first = darkState === null;
      setDark(wantDark, first);
    }
  }

  /* ---------- Controls ---------- */
  function toggleFullscreen() {
    var el = document.documentElement;
    var inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (inFs) {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    } else {
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) { try { var r = req.call(el); if (r && r.catch) r.catch(function () {}); } catch (e) {} }
    }
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); toggleFullscreen(); btn.classList.add('gone'); });
  function onFsChange() {
    var inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!inFs) btn.classList.remove('gone');
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  function toggle24() {
    use24 = !use24;
    try { localStorage.setItem('clock24', use24 ? '1' : '0'); } catch (e) {}
    render(new Date());
  }
  clockEl.addEventListener('click', function (e) {
    if (new Date().getHours() < WAKE_HOUR) return; // while dark, a click is a peek, handled below
    e.stopPropagation();
    toggle24();
  });

  // While it's dark, any click or key peeks for a few seconds
  function peek() {
    if (new Date().getHours() < WAKE_HOUR) {
      peekUntil = Date.now() + PEEK_MS;
      tick();
      return true;
    }
    return false;
  }
  document.addEventListener('click', function () { peek(); showControls(); });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (peek()) return;
    var k = e.key.toLowerCase();
    if (k === 'f') toggleFullscreen();
    else if (k === 'h') toggle24();
    else if (k === 'c') celebrate();
    else if (k === 't') demoFlashUntil = Date.now() + 10000;
    else if (k === 'd') demoDarkUntil = Date.now() + 5000;
    tick();
  });

  // Controls appear when you move, then get out of the way
  var idleTimer = null;
  function showControls() {
    document.body.classList.add('active');
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      document.body.classList.remove('active');
      document.body.classList.add('idle');
    }, 3000);
  }
  ['mousemove', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, showControls, { passive: true });
  });
  showControls();

  /* ---------- Keep the screen awake ---------- */
  function keepAwake() {
    try {
      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });
  keepAwake();
  document.addEventListener('click', keepAwake, { once: true });

  /* ---------- Go ---------- */
  tick();
  setInterval(tick, 200);
})();
</script>
</body>
</html>
